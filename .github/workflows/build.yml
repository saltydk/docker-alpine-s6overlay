name: reusable-build

on:
  workflow_call:
    inputs:
      source-sha:
        description: Exact source revision to check out, label, test, and publish
        required: true
        type: string
      should-build:
        description: Build and evaluate candidates
        required: true
        type: boolean
      scan-published:
        description: Scan the published image when no build is required
        required: true
        type: boolean
      publish:
        description: Publish accepted candidates
        required: true
        type: boolean
      event-name:
        description: Original caller event name
        required: true
        type: string
      has-update-report:
        description: The caller uploaded an update report
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

env:
  IMAGE: saltydk/alpine-s6overlay

jobs:
  static:
    runs-on: ubuntu-latest
    outputs:
      input-sha: ${{ steps.inputs.outputs.input-sha }}
      locks-sha: ${{ steps.inputs.outputs.locks-sha256 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source-sha }}

      - name: Run package-lock tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify committed image inputs
        id: inputs
        run: python3 scripts/manage_inputs.py verify --github-output "$GITHUB_OUTPUT"

      - name: Check service script
        run: shellcheck -s sh root/etc/cont-init.d/10-adduser

      - name: Check shell scripts
        run: shellcheck scripts/apk-lock.sh scripts/test-image.sh

      - name: Check workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: '-ignore "unexpected key .queue. for .concurrency. section"'


  test-candidate:
    needs: static
    if: inputs.should-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            architecture: x86_64
            apk_architecture: x86_64
          - platform: linux/arm64
            slug: arm64
            architecture: aarch64
            apk_architecture: aarch64
          - platform: linux/arm/v7
            slug: arm-v7
            architecture: armv7l
            apk_architecture: armv7
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source-sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Capture published baseline
        run: >-
          python3 scripts/build_report.py snapshot
          --repository "$GITHUB_REPOSITORY"
          --image alpine-s6overlay
          --platform "${{ matrix.platform }}"
          --stage runtime
          --reference "${IMAGE}:latest"
          --source-sha "${{ inputs.source-sha }}"
          --output runtime-baseline.json

      - name: Capture published builder baseline
        run: >-
          python3 scripts/build_report.py snapshot
          --repository "$GITHUB_REPOSITORY"
          --image alpine-s6overlay
          --platform "${{ matrix.platform }}"
          --stage builder
          --reference "${IMAGE}:latest"
          --source-sha "${{ inputs.source-sha }}"
          --output builder-baseline.json

      - name: Build builder candidate
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          target: builder
          load: true
          platforms: ${{ matrix.platform }}
          pull: true
          tags: local/alpine-s6overlay:builder-${{ matrix.slug }}-${{ inputs.source-sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source-sha }}
            io.saltydk.image-inputs.sha256=${{ needs.static.outputs.input-sha }}
          build-args: |
            APK_LOCKS_SHA256=${{ needs.static.outputs.locks-sha }}
            IMAGE_INPUTS_SHA256=${{ needs.static.outputs.input-sha }}
          cache-from: type=gha,scope=base-${{ matrix.slug }}

      - name: Verify builder package inventory
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/build_report.py verify
          --repository "$GITHUB_REPOSITORY"
          --image alpine-s6overlay
          --platform "${{ matrix.platform }}"
          --stage builder
          --candidate "local/alpine-s6overlay:builder-${{ matrix.slug }}-${{ inputs.source-sha }}"
          --lock "packages/builder/${{ matrix.apk_architecture }}.lock"
          --baseline builder-baseline.json
          --source-sha "${{ inputs.source-sha }}"
          --output "builder-${{ matrix.slug }}-report.json"

      - name: Build candidate
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          pull: true
          tags: local/alpine-s6overlay:${{ matrix.slug }}-${{ inputs.source-sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source-sha }}
            io.saltydk.image-inputs.sha256=${{ needs.static.outputs.input-sha }}
          build-args: |
            APK_LOCKS_SHA256=${{ needs.static.outputs.locks-sha }}
            IMAGE_INPUTS_SHA256=${{ needs.static.outputs.input-sha }}
          cache-from: type=gha,scope=base-${{ matrix.slug }}
          cache-to: type=gha,scope=base-${{ matrix.slug }},mode=max

      - name: Test candidate
        if: ${{ !cancelled() }}
        run: >-
          scripts/test-image.sh
          "local/alpine-s6overlay:${{ matrix.slug }}-${{ inputs.source-sha }}"
          "${{ matrix.platform }}"
          "${{ matrix.architecture }}"

      - name: Verify candidate package inventory
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/build_report.py verify
          --repository "$GITHUB_REPOSITORY"
          --image alpine-s6overlay
          --platform "${{ matrix.platform }}"
          --stage runtime
          --candidate "local/alpine-s6overlay:${{ matrix.slug }}-${{ inputs.source-sha }}"
          --lock "packages/runtime/${{ matrix.apk_architecture }}.lock"
          --baseline runtime-baseline.json
          --source-sha "${{ inputs.source-sha }}"
          --output "runtime-${{ matrix.slug }}-report.json"

      - name: Upload candidate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alpine-s6overlay-candidate-${{ matrix.slug }}
          path: '*-${{ matrix.slug }}-report.json'
          if-no-files-found: error

      - name: Scan candidate with shared container tooling
        id: security
        if: ${{ !cancelled() }}
        uses: saltyorg/github-actions/container-scan@v1.4.4
        with:
          image: local/alpine-s6overlay:${{ matrix.slug }}-${{ inputs.source-sha }}
          name: alpine-s6overlay
          platform: ${{ matrix.platform }}
          output-directory: security/${{ matrix.slug }}
          scout-enabled: ${{ inputs.event-name != 'pull_request' }}
          enforce-kev: ${{ inputs.event-name != 'pull_request' }}
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retain candidate security reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: docker-alpine-s6overlay-security-candidate-alpine-s6overlay-${{ matrix.slug }}
          path: security/${{ matrix.slug }}
          if-no-files-found: warn

  scan-published:
    needs: [static, publish]
    if: ${{ !cancelled() && (inputs.scan-published || (needs.publish.result == 'success' && needs.publish.outputs.latest-promoted == 'true')) }}
    permissions:
      contents: read
      security-events: write
      issues: write
    uses: ./.github/workflows/security-scan.yml
    with:
      source-sha: ${{ inputs.source-sha }}
    secrets: inherit

  publish:
    concurrency:
      group: docker-alpine-s6overlay-publication
      queue: max
      cancel-in-progress: false
    needs:
      - static
      - test-candidate
    if: >-
      always() &&
      inputs.publish &&
      inputs.should-build &&
      needs.static.result == 'success' &&
      needs.test-candidate.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      published-digest: ${{ steps.effective.outputs.digest }}
      latest-promoted: ${{ steps.promote.outcome == 'success' && steps.verify-latest.outcome == 'success' && steps.record-latest.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=sha-${{ inputs.source-sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source-sha }}
            io.saltydk.image-inputs.sha256=${{ needs.static.outputs.input-sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Inspect immutable SHA tag
        id: existing
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: >-
          python3 scripts/publication.py inspect-sha
          --repository "$GITHUB_REPOSITORY"
          --image-name alpine-s6overlay
          --platform linux/amd64
          --stage runtime
          --reference "${IMAGE}:sha-${SOURCE_SHA}"
          --source-sha "$SOURCE_SHA"
          --output exact-sha-tag.json
          --github-output "$GITHUB_OUTPUT"

      - name: Publish image
        id: docker-build
        if: steps.existing.outputs.exists == 'false'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          pull: true
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APK_LOCKS_SHA256=${{ needs.static.outputs.locks-sha }}
            IMAGE_INPUTS_SHA256=${{ needs.static.outputs.input-sha }}
          provenance: false
          cache-from: |
            type=gha,scope=base-amd64
            type=gha,scope=base-arm64
            type=gha,scope=base-arm-v7
          cache-to: type=gha,scope=base-publish,mode=max

      - name: Select effective published digest
        id: effective
        env:
          BUILT_DIGEST: ${{ steps.docker-build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
        run: >-
          python3 scripts/publication.py digest
          --built-digest "$BUILT_DIGEST"
          --existing-digest "$EXISTING_DIGEST"
          --github-output "$GITHUB_OUTPUT"

      - name: Record immutable SHA publication
        id: record-sha
        env:
          PUBLISHED_DIGEST: ${{ steps.effective.outputs.digest }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: >-
          python3 scripts/publication.py record
          --reference "${IMAGE}:sha-${SOURCE_SHA}"
          --digest "$PUBLISHED_DIGEST"
          --output published-sha.txt

      - name: Verify published SHA tag and SBOM
        id: verify-sha
        env:
          INPUT_SHA: ${{ needs.static.outputs.input-sha }}
          LOCKS_SHA: ${{ needs.static.outputs.locks-sha }}
          PUBLISHED_DIGEST: ${{ steps.effective.outputs.digest }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: >-
          python3 scripts/publication.py verify-sha
          --reference "${IMAGE}:sha-${SOURCE_SHA}"
          --digest "$PUBLISHED_DIGEST"
          --source-sha "$SOURCE_SHA"
          --locks-sha "$LOCKS_SHA"
          --input-sha "$INPUT_SHA"

      - name: Check latest promotion
        id: latest
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: >-
          python3 scripts/check_latest_promotion.py
          --image "$IMAGE"
          --source-sha "$SOURCE_SHA"
          --default-branch "$DEFAULT_BRANCH"
          --github-output "$GITHUB_OUTPUT"

      - name: Promote verified image to latest
        id: promote
        if: steps.latest.outputs.promote == 'true'
        env:
          PUBLISHED_DIGEST: ${{ steps.effective.outputs.digest }}
        run: >-
          python3 scripts/publication.py promote
          --reference "${IMAGE}:latest"
          --digest "$PUBLISHED_DIGEST"
          --output promoted-latest.txt

      - name: Verify latest alias
        id: verify-latest
        if: steps.latest.outputs.promote == 'true'
        env:
          PUBLISHED_DIGEST: ${{ steps.effective.outputs.digest }}
        run: >-
          python3 scripts/publication.py verify
          --reference "${IMAGE}:latest"
          --digest "$PUBLISHED_DIGEST"

      - name: Record verified latest publication
        id: record-latest
        if: steps.latest.outputs.promote == 'true'
        env:
          PUBLISHED_DIGEST: ${{ steps.effective.outputs.digest }}
        run: >-
          python3 scripts/publication.py record
          --reference "${IMAGE}:latest"
          --digest "$PUBLISHED_DIGEST"
          --output published-latest.txt

      - name: Capture publication outcomes
        if: always()
        run: >-
          python3 scripts/publication.py outcomes
          --output publication-outcomes.txt
          --outcome "inspect=${{ steps.existing.outcome }}"
          --outcome "build=${{ steps.docker-build.outcome }}"
          --outcome "digest=${{ steps.effective.outcome }}"
          --outcome "record-sha=${{ steps.record-sha.outcome }}"
          --outcome "verify-sha=${{ steps.verify-sha.outcome }}"
          --outcome "latest-check=${{ steps.latest.outcome }}"
          --outcome "latest-status=${{ steps.latest.outputs.status }}"
          --outcome "promote=${{ steps.promote.outcome }}"
          --outcome "verify-latest=${{ steps.verify-latest.outcome }}"
          --outcome "record-latest=${{ steps.record-latest.outcome }}"

      - name: Upload publication records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alpine-s6overlay-publication
          path: |
            publication-outcomes.txt
            published-*.txt
            promoted-*.txt
          if-no-files-found: error

  report:
    if: always()
    needs:
      - static
      - test-candidate
      - scan-published
      - publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha }}

      - name: Download candidate reports
        if: inputs.should-build
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: alpine-s6overlay-candidate-*
          path: candidate-reports
          merge-multiple: true

      - name: Download update report
        if: inputs.has-update-report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: alpine-s6overlay-update-report
          path: update-reports

      - name: Download publication records
        if: ${{ always() && needs.publish.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: alpine-s6overlay-publication
          path: publication-records

      - name: Write grouped build report
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          CANDIDATE_RESULT: ${{ needs.test-candidate.result }}
          PUBLISHED_SCAN_RESULT: ${{ needs.scan-published.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          SHOULD_BUILD: ${{ inputs.should-build }}
          SHOULD_PUBLISH: ${{ inputs.publish }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: >-
          python3 scripts/build_result.py report
          --repository "$GITHUB_REPOSITORY"
          --source-sha "$SOURCE_SHA"
          --static-result "$STATIC_RESULT"
          --candidate-result "$CANDIDATE_RESULT"
          --published-scan-result "$PUBLISHED_SCAN_RESULT"
          --publish-result "$PUBLISH_RESULT"
          --should-build "$SHOULD_BUILD"
          --should-publish "$SHOULD_PUBLISH"
          --source-root .
          --candidate-reports candidate-reports
          --update-reports update-reports
          --publication-records publication-records
          --output build-report.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload grouped build report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alpine-s6overlay-build-report-${{ inputs.source-sha }}
          path: build-report.json
          if-no-files-found: error

      - name: Verify required jobs
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          CANDIDATE_RESULT: ${{ needs.test-candidate.result }}
          PUBLISHED_SCAN_RESULT: ${{ needs.scan-published.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          SHOULD_BUILD: ${{ inputs.should-build }}
          SHOULD_PUBLISH: ${{ inputs.publish }}
          SCAN_PUBLISHED: ${{ inputs.scan-published }}
        run: >-
          python3 scripts/build_result.py require
          --static-result "$STATIC_RESULT"
          --candidate-result "$CANDIDATE_RESULT"
          --published-scan-result "$PUBLISHED_SCAN_RESULT"
          --publish-result "$PUBLISH_RESULT"
          --should-build "$SHOULD_BUILD"
          --should-publish "$SHOULD_PUBLISH"
          --scan-published "$SCAN_PUBLISHED"
