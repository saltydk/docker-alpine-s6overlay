name: ci

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '22 12 * * *'
  workflow_dispatch:
    inputs:
      refresh-packages:
        description: Resolve and commit current Alpine package locks before building
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: alpine-s6overlay-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.refresh-packages)
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
      should-build: 'true'
      scan-published: 'false'
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - name: Select event source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "source-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  update-source:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.refresh-packages)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
      should-build: ${{ steps.update.outputs.should-build }}
      scan-published: ${{ steps.source.outputs.scan-published }}
      publish: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: master

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Resolve image inputs
        id: update
        run: >-
          python3 scripts/manage_inputs.py update --write
          --github-output "$GITHUB_OUTPUT"
          --report update-report.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Verify resolved inputs
        run: python3 scripts/manage_inputs.py verify

      - name: Commit image inputs
        if: steps.update.outputs.changed == 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Dockerfile packages/builder/*.lock packages/runtime/*.lock
          git diff --cached --check
          {
            echo 'build(packages): refresh alpine package locks'
            echo
            python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.build_report import render_markdown
          print(render_markdown(json.loads(Path('update-report.json').read_text())))
          PY
          } > "$RUNNER_TEMP/commit-message"
          git commit --cleanup=verbatim --file "$RUNNER_TEMP/commit-message"
          git push origin HEAD:master

      - name: Select committed source
        id: source
        env:
          SHOULD_BUILD: ${{ steps.update.outputs.should-build }}
        run: |
          echo "source-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$SHOULD_BUILD" == "true" ]]; then
            echo "scan-published=false" >> "$GITHUB_OUTPUT"
          else
            echo "scan-published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload update report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alpine-s6overlay-update-report
          path: update-report.json
          if-no-files-found: error

  build:
    if: >-
      always() &&
      (needs.source.result == 'success' || needs.update-source.result == 'success')
    needs:
      - source
      - update-source
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/build.yml
    with:
      source-sha: ${{ needs.update-source.outputs.source-sha || needs.source.outputs.source-sha }}
      should-build: ${{ (needs.update-source.outputs.should-build || needs.source.outputs.should-build) == 'true' }}
      scan-published: ${{ (needs.update-source.outputs.scan-published || needs.source.outputs.scan-published) == 'true' }}
      publish: ${{ (needs.update-source.outputs.publish || needs.source.outputs.publish) == 'true' }}
      event-name: ${{ github.event_name }}
    secrets: inherit
