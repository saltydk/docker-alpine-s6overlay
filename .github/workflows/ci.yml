name: ci

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '22 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: alpine-s6overlay-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: saltydk/alpine-s6overlay
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.74.0

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run package-check tests
        run: python3 -m unittest discover -s tests -v

      - name: Check shell scripts
        run: |
          shellcheck -s sh root/etc/cont-init.d/10-adduser
          shellcheck scripts/test-image.sh

      - name: Check workflows
        uses: docker://rhysd/actionlint:1.7.12

  prepare:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.decision.outputs.should-build }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        if: github.event_name == 'schedule'
        uses: docker/setup-qemu-action@v4.3.0

      - name: Check published APK packages
        id: apk-updates
        if: github.event_name == 'schedule'
        run: python3 scripts/check_apk_updates.py --github-output "$GITHUB_OUTPUT"

      - name: Select workflow path
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          APK_REFRESH: ${{ steps.apk-updates.outputs.needs-refresh }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            echo "should-build=${APK_REFRESH:-false}" >> "$GITHUB_OUTPUT"
          else
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          fi

  test-candidate:
    needs:
      - static
      - prepare
    if: needs.prepare.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            architecture: x86_64
          - platform: linux/arm64
            slug: arm64
            architecture: aarch64
          - platform: linux/arm/v7
            slug: arm-v7
            architecture: armv7l
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build candidate
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache-filters: runtime
          tags: local/alpine-s6overlay:${{ matrix.slug }}-${{ github.sha }}
          cache-from: type=gha,scope=base-${{ matrix.slug }}
          cache-to: type=gha,scope=base-${{ matrix.slug }},mode=max

      - name: Test candidate
        run: scripts/test-image.sh "local/alpine-s6overlay:${{ matrix.slug }}-${{ github.sha }}" "${{ matrix.platform }}" "${{ matrix.architecture }}"

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true
          version: ${{ env.TRIVY_VERSION }}

      - name: Generate vulnerability report
        run: |
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL \
            --format sarif --output "trivy-${{ matrix.slug }}.sarif" \
            "local/alpine-s6overlay:${{ matrix.slug }}-${{ github.sha }}"

      - name: Enforce vulnerability policy
        run: |
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 \
            "local/alpine-s6overlay:${{ matrix.slug }}-${{ github.sha }}"

      - name: Upload vulnerability report
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          category: alpine-s6overlay-${{ matrix.slug }}
          sarif_file: trivy-${{ matrix.slug }}.sarif

  scan-published:
    needs:
      - static
      - prepare
    if: github.event_name == 'schedule' && needs.prepare.outputs.should-build != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            architecture: x86_64
          - platform: linux/arm64
            slug: arm64
            architecture: aarch64
          - platform: linux/arm/v7
            slug: arm-v7
            architecture: armv7l
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0

      - name: Test published image
        run: scripts/test-image.sh "${IMAGE}:latest" "${{ matrix.platform }}" "${{ matrix.architecture }}"

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true
          version: ${{ env.TRIVY_VERSION }}

      - name: Generate vulnerability report
        run: |
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL \
            --platform "${{ matrix.platform }}" \
            --format sarif --output "trivy-${{ matrix.slug }}.sarif" \
            "${IMAGE}:latest"

      - name: Enforce vulnerability policy
        run: |
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL \
            --platform "${{ matrix.platform }}" \
            --ignore-unfixed --exit-code 1 "${IMAGE}:latest"

      - name: Upload vulnerability report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          category: alpine-s6overlay-${{ matrix.slug }}
          sarif_file: trivy-${{ matrix.slug }}.sarif

  publish:
    needs:
      - static
      - prepare
      - test-candidate
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.prepare.outputs.should-build == 'true' &&
      needs.test-candidate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          pull: true
          push: true
          tags: ${{ env.IMAGE }}:latest
          provenance: false
          cache-from: |
            type=gha,scope=base-amd64
            type=gha,scope=base-arm64
            type=gha,scope=base-arm-v7
          cache-to: type=gha,scope=base-publish,mode=max

  acceptance:
    if: always()
    needs:
      - static
      - prepare
      - test-candidate
      - scan-published
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          STATIC_RESULT: ${{ needs.static.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          SHOULD_BUILD: ${{ needs.prepare.outputs.should-build }}
          TEST_RESULT: ${{ needs.test-candidate.result }}
          PUBLISHED_SCAN_RESULT: ${{ needs.scan-published.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          [[ "$STATIC_RESULT" == "success" ]]
          [[ "$PREPARE_RESULT" == "success" ]]
          if [[ "$SHOULD_BUILD" == "true" ]]; then
            [[ "$TEST_RESULT" == "success" ]]
            if [[ "$EVENT_NAME" != "pull_request" ]]; then
              [[ "$PUBLISH_RESULT" == "success" ]]
            fi
          else
            [[ "$EVENT_NAME" == "schedule" ]]
            [[ "$PUBLISHED_SCAN_RESULT" == "success" ]]
          fi
